server:
  port: 8082

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        # USER SERVICE
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**

        # HOSTEL SERVICE
        - id: hostel-service
          uri: lb://HOSTEL-SERVICE
          predicates:
            - Path=/api/hostels/**

        # BOOKING SERVICE
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka        