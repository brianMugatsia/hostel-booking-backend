version: "3.8"

services:

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server

  booking-service:
    build: ./booking_service
    container_name: booking-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server

  room-service:
    build: ./room_service
    container_name: room-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server

  payment-service:
    build: ./payment_service
    container_name: payment-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server

  user-service:
    build: ./user_service
    container_name: user-service
    ports:
      - "9090:9090"
    depends_on:
      - eureka-server
