server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hostel_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 258036bm,
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

  application:
    name: hostel-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

#  AWS S3 Configuration
cloud:
  aws:
    region:
      static: us-east-1   # choose your AWS region (e.g., us-east-1, eu-west-1)
    stack:
      auto: false
    credentials:
      access-key: YOUR_AWS_ACCESS_KEY
      secret-key: YOUR_AWS_SECRET_KEY

aws:
  s3:
    bucket: your-bucket-name   # replace with your actual S3 bucket name
